defaults:
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "wovr_robotwin_dual_task_grpo_openpi_pi05_head_only_no_state_tint_rm"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 8
  reward_coef: 1.0

  rollout_epoch: 8
  eval_rollout_epoch: 1 # set eval_rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean" 
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  # params for generation
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    seed: 0
    env_type: wovr_wm
    total_num_envs: 64
    group_size: ${algorithm.group_size}
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: false
    auto_reset: false
    ignore_terminations: false
    use_rel_reward: true
    latch_success_reward: true
    success_reward_threshold: 0.9
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192
    reward_coef: 1.0

    wm_env_type: robotwin
    reset_gripper_open: false
    enable_offload: false
    enable_kir: false
    kir_initial_frame: 250
    retain_action: true
    action_dim: 14

    video_cfg:
      save_video: True
      info_on_video: True
      fps: 1
      video_base_dir: /data/zsq/RLinf_A100/videos

    initial_image_path: /data/zsq/RLinf_A100/examples/embodiment/config/test_data/wanmultiview_robotwin_dual_task
    dataset_action_key: action
    dataset_state_key: state

    num_inference_steps: 5
    chunk: 8
    condition_frame_length: 5
    num_frames: 13
    rollout_context_mode: dense_history
    rollout_sparse_history_stride: 4
    image_size: [256, 320]

    wovr_view_mode: single
    wm_seed: 0
    sigma_shift: 5.0
    model_path: /data/zsq/diffsynth-studio-wujie-ppu/outputs/WoVR_single_singleviewpi05rollout/epoch-1059.safetensors

    base_model_path:
      - /data/zsq/Wan_model/diffusion_pytorch_model-00001-of-00003.safetensors
      - /data/zsq/Wan_model/diffusion_pytorch_model-00002-of-00003.safetensors
      - /data/zsq/Wan_model/diffusion_pytorch_model-00003-of-00003.safetensors
    VAE_path: /data/zsq/Wan_model/Wan2.2_VAE.pth
    T5_path: /data/zsq/Wan_model/models_t5_umt5-xxl-enc-bf16.pth
    vace_model_path: /data/zsq/diffsynth-studio-wujie-ppu/outputs/WoVR_single_singleviewpi05rollout/epoch-1059.safetensors
    vace_in_dim: 72
    raymap_mode: raw_stack4
    vace_view_embedding_num_views: 3
    vae_spatial_downsample: 16
    vae_temporal_downsample: 4

    prompt: "机械臂按照要求移动夹爪执行任务"
    cfg_scale: 1.0
    tiled: false

    camera_names: [head, left_wrist, right_wrist]
    camera_axis_mode: identity
    view_height: 256
    view_width: 320
    camera_original_height: 240
    camera_original_width: 320

    head_left_calib: /data/zsq/outputs/calib_eye_to_hand_head_left/result_eye_to_hand.json
    head_right_calib: /data/zsq/outputs/calib_eye_to_hand_head_right/result_eye_to_hand.json
    left_calib: /data/zsq/outputs/calib_eye_in_hand_left/result_eye_in_hand.json
    right_calib: /data/zsq/outputs/calib_eye_in_hand_right/result_eye_in_hand.json

    left_fk_fn: rlinf.envs.world_model.robotwin_urdf_fk.left_fk
    right_fk_fn: rlinf.envs.world_model.robotwin_urdf_fk.right_fk
    fk_urdf_path: /data/zsq/RoboTwin/assets/embodiments/aloha-agilex/config.yml
    fk_offset_path: null
    fk_base_link: null
    fk_tip_link: null
    fk_offset_mode: null
    fk_state_unit: rad
    fk_pose_quat_order: qwxyz

    traj_radius: 40
    traj_radius_mode: perspective
    traj_min_radius: 14
    traj_max_radius: 58
    traj_ref_depth: 0.30
    traj_near_depth: 0.19
    traj_far_depth: 0.69
    ray_o_vmin: -1.5
    ray_o_vmax: 1.5
    ray_d_vmin: -1.0
    ray_d_vmax: 1.0

    task_suite_name: robotwin
    reward_model:
      type: InstructionRoutedGripperTintResnetRewModel
      from_pretrained: /data/zsq/Reward_model/robotwin_tint_continue_singleview_correct_20260724_160333
      input_view: head
      tint_alpha: 0.42
      tint_green: 35.0
      gripper_value_min: 0.0
      gripper_value_max: 1.0
      task_routes:
        adjust_bottle:
          checkpoint: robotwin_adjust_bottle_head_gripper_tint/best.pth
          keywords: [bottle]
        click_bell:
          checkpoint: robotwin_click_bell_head_gripper_tint/best.pth
          keywords: [bell]
      threshold: null  # null means use threshold saved in best.pth
  eval:
    env_type: wovr_wm
    total_num_envs: 128
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: true
    auto_reset: True
    ignore_terminations: True
    use_rel_reward: true
    latch_success_reward: true
    success_reward_threshold: 0.9
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192
    reward_coef: 1.0
    is_eval: True

    wm_env_type: robotwin
    reset_gripper_open: false
    enable_offload: false
    enable_kir: false
    kir_initial_frame: 250
    retain_action: true
    action_dim: 14

    video_cfg:
      save_video: True
      info_on_video: true
      fps: 15
      video_base_dir: ${runner.logger.log_path}/video/eval_robotwin_grpo_pi05

    initial_image_path: /data/zsq/RLinf_A100/examples/embodiment/config/test_data/wanmultiview_robotwin_dual_task
    dataset_action_key: action
    dataset_state_key: state

    num_inference_steps: 5
    chunk: 8
    condition_frame_length: 5
    num_frames: 13
    rollout_context_mode: dense_history
    rollout_sparse_history_stride: 4
    image_size: [256, 320]

    wovr_view_mode: single
    wm_seed: 0
    sigma_shift: 5.0
    model_path: /data/zsq/diffsynth-studio-wujie-ppu/outputs/WoVR_single_singleviewpi05rollout/epoch-1059.safetensors

    base_model_path:
      - /data/zsq/Wan_model/diffusion_pytorch_model-00001-of-00003.safetensors
      - /data/zsq/Wan_model/diffusion_pytorch_model-00002-of-00003.safetensors
      - /data/zsq/Wan_model/diffusion_pytorch_model-00003-of-00003.safetensors
    VAE_path: /data/zsq/Wan_model/Wan2.2_VAE.pth
    T5_path: /data/zsq/Wan_model/models_t5_umt5-xxl-enc-bf16.pth
    vace_model_path: /data/zsq/diffsynth-studio-wujie-ppu/outputs/WoVR_single_singleviewpi05rollout/epoch-1059.safetensors
    vace_in_dim: 72
    raymap_mode: raw_stack4
    vace_view_embedding_num_views: 3
    vae_spatial_downsample: 16
    vae_temporal_downsample: 4

    prompt: "机械臂按照要求移动夹爪执行任务"
    cfg_scale: 1.0
    tiled: false

    camera_names: [head, left_wrist, right_wrist]
    camera_axis_mode: identity
    view_height: 256
    view_width: 320
    camera_original_height: 240
    camera_original_width: 320

    head_left_calib: /data/zsq/outputs/calib_eye_to_hand_head_left/result_eye_to_hand.json
    head_right_calib: /data/zsq/outputs/calib_eye_to_hand_head_right/result_eye_to_hand.json
    left_calib: /data/zsq/outputs/calib_eye_in_hand_left/result_eye_in_hand.json
    right_calib: /data/zsq/outputs/calib_eye_in_hand_right/result_eye_in_hand.json

    left_fk_fn: rlinf.envs.world_model.robotwin_urdf_fk.left_fk
    right_fk_fn: rlinf.envs.world_model.robotwin_urdf_fk.right_fk
    fk_urdf_path: /data/zsq/RoboTwin/assets/embodiments/aloha-agilex/config.yml
    fk_offset_path: null
    fk_base_link: null
    fk_tip_link: null
    fk_offset_mode: null
    fk_state_unit: rad
    fk_pose_quat_order: qwxyz

    traj_radius: 40
    traj_radius_mode: perspective
    traj_min_radius: 14
    traj_max_radius: 58
    traj_ref_depth: 0.30
    traj_near_depth: 0.19
    traj_far_depth: 0.69
    ray_o_vmin: -1.5
    ray_o_vmax: 1.5
    ray_d_vmin: -1.0
    ray_d_vmax: 1.0

    task_suite_name: robotwin
    reward_model:
      type: InstructionRoutedGripperTintResnetRewModel
      from_pretrained: /data/zsq/Reward_model/robotwin_tint_continue_singleview_correct_20260724_160333
      input_view: head
      tint_alpha: 0.42
      tint_green: 35.0
      gripper_value_min: 0.0
      gripper_value_max: 1.0
      task_routes:
        adjust_bottle:
          checkpoint: robotwin_adjust_bottle_head_gripper_tint/best.pth
          keywords: [bottle]
        click_bell:
          checkpoint: robotwin_click_bell_head_gripper_tint/best.pth
          keywords: [bell]
      threshold: null  # null means use threshold saved in best.pth

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: # TODO
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: /data/zsq/pi05_ckpt/pi05_nostate/400torch
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 1024 # maximum : global batch size = micro batch size * actor num_processes.
  seed: 42
  enable_offload: False

  # Override the default values in model/pi0_5
  # Override the default values in model/pi0_5
  model:
    model_path: /data/zsq/pi05_ckpt/pi05_nostate/400torch
    model_type: "openpi"
    num_action_chunks: 16 # interface for the env
    action_dim: 14
    num_steps: 5
    # add_value_head: True
    use_proprio: False
    openpi_data:
      adapt_to_pi: False
      extra_delta_transform: False
      ignore_state: True
    # openpi specific parameters
    openpi:
      config_name: pi05_robotwin_head_only_no_state
      num_images_in_input: 1
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      noise_method: "flow_sde"
      noise_level: 0.2
      sde_chunkwise_noise: true
      # value_after_vlm: True
      # detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
