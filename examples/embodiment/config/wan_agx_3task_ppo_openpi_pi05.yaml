defaults:
  - env/wan_agx@env.train
  - env/wan_agx@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "wan_agx_ppo_openpi_pi05"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 8
  eval_rollout_epoch: 1 # set eval_rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean" 
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  # params for generation
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  # Override the default values in env/libero_spatial
  # train:
  #   total_num_envs: 64
  #   max_episode_steps: 240 # max episode steps for truncation
  #   max_steps_per_rollout_epoch: 240
  train:
    total_num_envs: 64
    group_size: ${algorithm.group_size}
    max_episode_steps: 240 # max episode steps for truncation
    max_steps_per_rollout_epoch: 240
    reward_coef: ${algorithm.reward_coef}
    reset_gripper_open: True
    wan_wm_hf_ckpt_path: "/mnt/project_rlinf/jzn/ckpt_path/RLinf-Wan-Agx/" # https://huggingface.co/RLinf/RLinf-Wan-Libero-Spatial
    enable_offload: True # otherwise, may OOM
    num_inference_steps: 5
  eval:
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: agx_10d_3task_25_50_75
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/mnt/project_rlinf/jzn/workspace/openvla-oft/agx_10d_3task_25_50_75_base30000_logs/openvla-7b+agx_10d_3task_25_50_75+b8+lr-0.0005+lora-r32+dropout-0.0--sft_agx-10d-3task-25-50-75--30000_chkpt+agx_10d_3task_25_50_75+b8+lr-0.0005+lora-r32+dropout-0.0--sft_agx-10d-3task-25-50-75--20000_chkpt"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 2048 # maximum : global batch size = micro batch size * actor num_processes.
  seed: 42
  enable_offload: False

  # Override the default values in model/pi0_5
  # Override the default values in model/pi0_5
  model:
    # model_path: "/mnt/project_rlinf_hs/chenkang/openpi-main/checkpoints/sft/pi05_libero/few_sft/30000"
    model_path: "/mnt/project_rlinf/jzn/workspace/openvla-oft/agx_10d_3task_25_50_75_base30000_logs/openvla-7b+agx_10d_3task_25_50_75+b8+lr-0.0005+lora-r32+dropout-0.0--sft_agx-10d-3task-25-50-75--30000_chkpt+agx_10d_3task_25_50_75+b8+lr-0.0005+lora-r32+dropout-0.0--sft_agx-10d-3task-25-50-75--20000_chkpt"
    model_type: "openpi"
    num_action_chunks: 8 # interface for the env
    num_steps: 3
    add_value_head: True

    use_proprio: False
    # openpi specific parameters
    openpi:
      value_after_vlm: True
      num_images_in_input: 1

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False