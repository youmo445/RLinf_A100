defaults:
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "wan_multiview_packphone_0723_newstructure_grpo_openpi_pi05"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 8
  reward_coef: 1.0

  rollout_epoch: 8
  eval_rollout_epoch: 1 # set eval_rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean" 
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  # params for generation
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    seed: 0
    env_type: wan_multiview_wm
    total_num_envs: 64
    group_size: ${algorithm.group_size}
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: false
    # Keep the original episode-uniform reset distribution. Set this to
    # "balanced" only when intentionally balancing the four source-step groups.
    reward_group_sampling: balanced
    auto_reset: false
    ignore_terminations: false
    use_rel_reward: true
    latch_success_reward: true
    success_reward_threshold: 0.9
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192
    reward_coef: 1.0

    wm_env_type: arxx5_newcam
    reset_gripper_open: false
    enable_offload: false
    enable_kir: false
    kir_initial_frame: 250
    retain_action: true
    action_dim: 14

    video_cfg:
      save_video: True
      info_on_video: True
      fps: 1
      video_base_dir: /data/zsq/RLinf_A100/videos

    initial_image_path: /data/zsq/RLinf_A100/examples/embodiment/config/test_data/wanmultiview_arxx5_packphone_0721_four_groups_initial_states
    reward_group_manifest_path: /data/zsq/RLinf_A100/examples/embodiment/config/test_data/wanmultiview_arxx5_packphone_0721_four_groups_initial_states/manifest.json
    dataset_action_key: action
    dataset_state_key: state
    # The converted dataset intentionally stores action == state. Use state
    # explicitly as the reset joint pose to avoid the legacy lagged-action meaning.
    initial_joint_source: state

    num_inference_steps: 5
    chunk: ${.wm_chunk}
    condition_frame_length: ${.context_frames}
    num_frames: ${.wm_num_frames}
    wm_chunk: 8
    context_frames: 5
    wm_num_frames: 13
    rollout_context_mode: sparse_history
    rollout_sparse_history_stride: 4
    image_size: [672,224]

    base_model_path:
      - /data/zsq/Wan_model/Wan2.2-TI2V-5B/diffusion_pytorch_model-00001-of-00003.safetensors
      - /data/zsq/Wan_model/Wan2.2-TI2V-5B/diffusion_pytorch_model-00002-of-00003.safetensors
      - /data/zsq/Wan_model/Wan2.2-TI2V-5B/diffusion_pytorch_model-00003-of-00003.safetensors
    VAE_path: /data/zsq/Wan_model/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    T5_path: /data/zsq/Wan_model/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth
    vace_model_path: /data/zsq/diffsynth-studio-wujie-ppu/outputs/arxx5_new_packphone/epoch-69.safetensors
    vace_in_dim: 72
    raymap_mode: raw_stack4
    vace_view_embedding_num_views: 3
    vae_spatial_downsample: 16
    vae_temporal_downsample: 4

    prompt: "机械臂按照要求移动夹爪执行任务"
    wm_prompt_mode: fixed
    cfg_scale: 1.0
    tiled: false

    camera_names: [head, left_wrist, right_wrist]
    camera_axis_mode: identity
    view_height: 224
    view_width: 224
    camera_original_height: 480
    camera_original_width: 640

    head_left_calib: /data/zsq/diffsynth-studio-wujie-ppu/diffsynth/trainers/assets/arxx5_new_head_left_eye_to_hand.json
    head_right_calib: /data/zsq/diffsynth-studio-wujie-ppu/diffsynth/trainers/assets/arxx5_new_head_right_eye_to_hand.json
    left_calib: /data/zsq/outputs/calib_eye_in_hand_left/result_eye_in_hand.json
    right_calib: /data/zsq/outputs/calib_eye_in_hand_right/result_eye_in_hand.json

    left_fk_fn: diffsynth.trainers.arxx5_urdf_fk.left_fk
    right_fk_fn: diffsynth.trainers.arxx5_urdf_fk.right_fk
    fk_urdf_path: /data/zsq/diffsynth-studio-wujie-ppu/diffsynth/trainers/assets/x5.urdf
    fk_offset_path: /data/zsq/diffsynth-studio-wujie-ppu/diffsynth/trainers/assets/arxx5_fk_offsets.json
    fk_base_link: base_link
    fk_tip_link: link6
    fk_offset_mode: none
    fk_state_unit: rad
    fk_pose_quat_order: qwxyz

    traj_radius: 40
    traj_radius_mode: perspective
    traj_min_radius: 14
    traj_max_radius: 58
    traj_ref_depth: 0.30
    traj_near_depth: 0.19
    traj_far_depth: 0.69
    traj_map_renderer: alpha
    traj_circle_alpha: 160
    traj_local_x_offset: 0.145
    traj_axis_line_width: 4
    ray_o_vmin: -1.5
    ray_o_vmax: 1.5
    ray_d_vmin: -1.0
    ray_d_vmax: 1.0

    task_suite_name: arxx5_packphone_0721
    reward_model:
      type: EpisodeGroupRoutedResnetRewModel
      from_pretrained: /data/zsq/Reward_model/packphone_0721_four_groups_threeview_hdf5
      input_view: all
      threshold: null
      group_to_checkpoint:
        "1": group_1_step_000_099/best.pth
        "2": group_2_step_100_209/best.pth
        "3": group_3_step_210_379/best.pth
        "4": group_4_step_380_499/best.pth
  eval:
    env_type: wan_multiview_wm
    total_num_envs: 64
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: true
    reward_group_sampling: balanced
    auto_reset: True
    ignore_terminations: True
    use_rel_reward: false
    latch_success_reward: true
    success_reward_threshold: 0.9
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192
    reward_coef: 1.0
    is_eval: True

    wm_env_type: arxx5_newcam
    reset_gripper_open: false
    enable_offload: false
    enable_kir: false
    kir_initial_frame: 250
    retain_action: true
    action_dim: 14

    video_cfg:
      save_video: True
      info_on_video: true
      fps: 15
      video_base_dir: ${runner.logger.log_path}/video/eval_arxx5_newcam_0719_grpo_pi05

    initial_image_path: /data/zsq/RLinf_A100/examples/embodiment/config/test_data/wanmultiview_arxx5_packphone_0721_four_groups_initial_states
    reward_group_manifest_path: /data/zsq/RLinf_A100/examples/embodiment/config/test_data/wanmultiview_arxx5_packphone_0721_four_groups_initial_states/manifest.json
    dataset_action_key: action
    dataset_state_key: state
    # The converted dataset intentionally stores action == state. Use state
    # explicitly as the reset joint pose to avoid the legacy lagged-action meaning.
    initial_joint_source: state

    num_inference_steps: 5
    chunk: ${.wm_chunk}
    condition_frame_length: ${.context_frames}
    num_frames: ${.wm_num_frames}
    wm_chunk: 8
    context_frames: 5
    wm_num_frames: 13
    rollout_context_mode: sparse_history
    rollout_sparse_history_stride: 4
    image_size: [672, 224]

    base_model_path:
      - /data/zsq/Wan_model/Wan2.2-TI2V-5B/diffusion_pytorch_model-00001-of-00003.safetensors
      - /data/zsq/Wan_model/Wan2.2-TI2V-5B/diffusion_pytorch_model-00002-of-00003.safetensors
      - /data/zsq/Wan_model/Wan2.2-TI2V-5B/diffusion_pytorch_model-00003-of-00003.safetensors
    VAE_path: /data/zsq/Wan_model/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    T5_path: /data/zsq/Wan_model/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth
    vace_model_path: /data/zsq/diffsynth-studio-wujie-ppu/outputs/arxx5_new_packphone/epoch-69.safetensors
