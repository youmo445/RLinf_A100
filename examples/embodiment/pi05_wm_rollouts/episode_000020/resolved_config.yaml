actor:
  model:
    model_type: openpi
    model_path: /data/zsq/openpi/checkpoints/pi05_arxx5/arxx5_h=16_0513/5000torch
    precision: null
    num_action_chunks: 16
    action_dim: 14
    is_lora: false
    lora_rank: 32
    use_proprio: false
    num_steps: 3
    add_value_head: true
    openpi:
      config_name: pi05_arxx5
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: ${actor.model.num_action_chunks}
      num_steps: ${actor.model.num_steps}
      train_expert_only: true
      action_env_dim: ${actor.model.action_dim}
      noise_method: flow_sde
      add_value_head: ${actor.model.add_value_head}
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
      use_dsrl: false
      dsrl_state_dim: 8
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    fsdp_size: -1
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 64
  global_batch_size: 2048
  seed: 42
  enable_offload: false
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    transport_device: cpu
    delta_encoding: true
    compression: none
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: wan_multiview_ppo_openpi_pi05
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 10
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 8
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
env:
  group_name: EnvGroup
  train:
    seed: 0
    env_type: wan_multiview_wm
    total_num_envs: 1
    group_size: 1
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    auto_reset: false
    ignore_terminations: false
    use_rel_reward: false
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 320
    reward_coef: 1.0
    wm_env_type: arxx5
    reset_gripper_open: false
    enable_offload: false
    enable_kir: false
    retain_action: true
    action_dim: 14
    video_cfg:
      save_video: false
      info_on_video: true
      fps: 15
      video_base_dir: /data/zsq/RLinf/videos
    initial_image_path: /data/zsq/RLinf/examples/embodiment/config/test_data/wanmultiview_arxx5_stack_blocks_0516
    dataset_action_key: action
    dataset_state_key: state
    num_inference_steps: 5
    chunk: 16
    condition_frame_length: 1
    num_frames: 17
    image_size:
    - 480
    - 224
    base_model_path:
    - /data/zsq/Wan_model/diffusion_pytorch_model-00001-of-00003.safetensors
    - /data/zsq/Wan_model/diffusion_pytorch_model-00002-of-00003.safetensors
    - /data/zsq/Wan_model/diffusion_pytorch_model-00003-of-00003.safetensors
    VAE_path: /data/zsq/Wan_model/Wan2.2_VAE.pth
    T5_path: /data/zsq/Wan_model/models_t5_umt5-xxl-enc-bf16.pth
    vace_model_path: /data/zsq/diffsynth-studio-wujie-ppu/outputs/arxx5/epoch-99.safetensors
    vace_in_dim: 144
    prompt: 机械臂按照要求移动夹爪执行任务
    cfg_scale: 1.0
    tiled: false
    camera_names:
    - head
    - left_wrist
    - right_wrist
    camera_axis_mode: identity
    view_height: 160
    view_width: 224
    camera_original_height: 480
    camera_original_width: 640
    head_left_calib: /data/zsq/outputs/calib_eye_to_hand_head_left/result_eye_to_hand.json
    head_right_calib: /data/zsq/outputs/calib_eye_to_hand_head_right/result_eye_to_hand.json
    left_calib: /data/zsq/outputs/calib_eye_in_hand_left/result_eye_in_hand.json
    right_calib: /data/zsq/outputs/calib_eye_in_hand_right/result_eye_in_hand.json
    left_fk_fn: rlinf.envs.world_model.arxx5_urdf_fk.left_fk
    right_fk_fn: rlinf.envs.world_model.arxx5_urdf_fk.right_fk
    fk_urdf_path: /data/zsq/x5.urdf
    fk_offset_path: /data/zsq/RLinf/rlinf/envs/world_model/arxx5_fk_offsets.json
    fk_base_link: base_link
    fk_tip_link: link6
    fk_offset_mode: base
    fk_state_unit: rad
    fk_pose_quat_order: qwxyz
    traj_radius: 40
    traj_radius_mode: perspective
    traj_min_radius: 14
    traj_max_radius: 58
    traj_ref_depth: 0.3
    traj_near_depth: 0.19
    traj_far_depth: 0.69
    ray_o_vmin: -1.5
    ray_o_vmax: 1.5
    ray_d_vmin: -1.0
    ray_d_vmax: 1.0
    task_suite_name: arxx5
    reward_model:
      type: ResnetRewModel
      from_pretrained: /data/zsq/stack_blocks_bimanual_0513/reward_model_runs/resnet_multi/best.pth
      threshold: null
  eval:
    env_type: wan_multiview_wm
    total_num_envs: 64
    group_size: 1
    use_fixed_reset_state_ids: false
    use_ordered_reset_state_ids: true
    auto_reset: true
    ignore_terminations: true
    use_rel_reward: false
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 320
    reward_coef: 1.0
    is_eval: true
    wm_env_type: arxx5
    reset_gripper_open: false
    enable_offload: false
    enable_kir: false
    retain_action: true
    action_dim: 14
    video_cfg:
      save_video: true
      info_on_video: true
      fps: 15
      video_base_dir: ${runner.logger.log_path}/video/eval
    initial_image_path: /data/zsq/RLinf/examples/embodiment/config/test_data/wanmultiview_arxx5_stack_blocks_0516
    dataset_action_key: action
    dataset_state_key: state
    num_inference_steps: 5
    chunk: 16
    condition_frame_length: 1
    num_frames: 17
    image_size:
    - 480
    - 224
    base_model_path:
    - /data/zsq/Wan_model/diffusion_pytorch_model-00001-of-00003.safetensors
    - /data/zsq/Wan_model/diffusion_pytorch_model-00002-of-00003.safetensors
    - /data/zsq/Wan_model/diffusion_pytorch_model-00003-of-00003.safetensors
    VAE_path: /data/zsq/Wan_model/Wan2.2_VAE.pth
    T5_path: /data/zsq/Wan_model/models_t5_umt5-xxl-enc-bf16.pth
    vace_model_path: /data/zsq/diffsynth-studio-wujie-ppu/outputs/arxx5/epoch-99.safetensors
    vace_in_dim: 144
    prompt: 机械臂按照要求移动夹爪执行任务
    cfg_scale: 1.0
    tiled: false
    camera_names:
    - head
    - left_wrist
    - right_wrist
    camera_axis_mode: identity
    view_height: 160
    view_width: 224
    camera_original_height: 480
    camera_original_width: 640
    head_left_calib: /data/zsq/outputs/calib_eye_to_hand_head_left/result_eye_to_hand.json
    head_right_calib: /data/zsq/outputs/calib_eye_to_hand_head_right/result_eye_to_hand.json
    left_calib: /data/zsq/outputs/calib_eye_in_hand_left/result_eye_in_hand.json
    right_calib: /data/zsq/outputs/calib_eye_in_hand_right/result_eye_in_hand.json
    left_fk_fn: rlinf.envs.world_model.arxx5_urdf_fk.left_fk
    right_fk_fn: rlinf.envs.world_model.arxx5_urdf_fk.right_fk
    fk_urdf_path: /data/zsq/x5.urdf
    fk_offset_path: /data/zsq/RLinf/rlinf/envs/world_model/arxx5_fk_offsets.json
    fk_base_link: base_link
    fk_tip_link: link6
    fk_offset_mode: base
    fk_state_unit: rad
    fk_pose_quat_order: qwxyz
    traj_radius: 40
    traj_radius_mode: perspective
    traj_min_radius: 14
    traj_max_radius: 58
    traj_ref_depth: 0.3
    traj_near_depth: 0.19
    traj_far_depth: 0.69
    ray_o_vmin: -1.5
    ray_o_vmax: 1.5
    ray_d_vmin: -1.0
    ray_d_vmax: 1.0
    task_suite_name: arxx5
    reward_model:
      type: ResnetRewModel
      from_pretrained: /data/zsq/stack_blocks_bimanual_0513/reward_model_runs/resnet_multi/latest.pth
      threshold: null
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: null
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /data/zsq/openpi/checkpoints/pi05_arxx5/arxx5_h=16_0513/5000torch
    precision: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
